<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkHub</title>
<meta name="description" content="WorkHub · 零构建、本地优先的扩展式效率工作台，五区布局与可插拔主题风格。">
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1f1f'/%3E%3Cpath d='M13 10l-5 6 5 6M19 10l5 6-5 6' stroke='%234ec9b0' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme-color="dark">

<!-- 顶部栏 · 主菜单一级入口 -->
<header class="zone zone-top" id="zoneTop">
  <div class="top-left">
    <button id="navToggle" class="icon-btn nav-toggle" title="收起菜单" aria-label="收起菜单">
      <svg class="nav-icon nav-icon-collapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 9-3 3 3 3"/></svg>
      <svg class="nav-icon nav-icon-menu" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">WorkHub</div>
    <!-- 二级系统页顶栏：返回按钮 + 页面标题（替换 brand） -->
    <div class="top-system" id="topSystem" aria-hidden="true">
      <button class="back-btn top-back" id="btnTopBack" title="返回" aria-label="返回">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m14.5 6-6 6 6 6"/></svg></span>
        <span class="top-back-label">返回</span>
      </button>
      <div class="top-system-title" id="topSystemTitle"></div>
    </div>
  </div>
  <div class="top-mounts" id="zoneTopMounts"></div>
  <!-- 系统页顶栏右侧操作区：由系统页 meta.topActions 注入（当前为设置页的界面/源码切换） -->
  <div class="top-page-actions" id="topPageActions"></div>
  <div class="top-right">
    <button id="btnRefresh" class="icon-btn top-refresh" title="刷新数据（云端同步 + 本地回读）" aria-label="刷新整个项目数据">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></span>
    </button>
    <button id="btnUser" class="user-chip" title="个人面板" aria-label="打开个人面板">HSF</button>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>

<!-- 三栏工作区：左主菜单 / 中主内容 / 右功能菜单 -->
<div class="app">
  <aside class="zone zone-left" id="zoneLeft"></aside>
  <main class="zone zone-center" id="zoneCenter"></main>
  <aside class="zone zone-right" id="zoneRight" hidden>
    <button class="zone-close" id="zoneRightClose" title="收起功能面板" aria-label="收起">×</button>
    <div class="zone-right-body" id="zoneRightBody"></div>
  </aside>
</div>

<!-- 五区尺寸拖拽手柄：左栏 / 右栏改宽度，底栏改高度 -->
<div class="zone-resizer zone-resizer-left" id="resizerLeft" role="separator" aria-orientation="vertical" aria-label="调整左侧栏宽度" tabindex="0" title="拖动调整左侧栏宽度"></div>
<div class="zone-resizer zone-resizer-right" id="resizerRight" role="separator" aria-orientation="vertical" aria-label="调整右侧栏宽度" tabindex="0" title="拖动调整右侧栏宽度"></div>
<div class="zone-resizer zone-resizer-bottom" id="resizerBottom" role="separator" aria-orientation="horizontal" aria-label="调整底部栏高度" tabindex="0" title="拖动调整底部栏高度"></div>

<!-- 底部栏 · 扩展功能状态条 -->
<footer class="zone zone-bottom" id="zoneBottom">
  <div class="bottom-label" id="zoneBottomLabel"></div>
  <div class="bottom-hint">
    <span id="hintExtShortcut" hidden><span class="kbd" id="hintExtKey"></span> <span id="hintExtName"></span></span>
    <span class="kbd" id="hintBack">Esc</span> 返回
    <span class="kbd" id="hintSettings">⌘,</span> 设置
  </div>
</footer>

<script src="vendor/sqljs/sql-wasm.js"></script>
<script src="vendor/sortablejs/Sortable.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
