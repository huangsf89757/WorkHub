<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>界面样式详情 · WorkHub 设计原型</title>
<!--
  界面样式详情页 · 交互式设计原型（简化版）
  入口：设置 › 界面样式 › 皮肤卡片「⋯」 › 查看详情
  三个 Tab：介绍 / 预览 / 挂载点配置
  挂载点配置：单一树形结构 + 新增 + 删除（有扩展绑定时弹窗确认并转移）
  架构映射：getSkinMountPoints / getMenuLayout → 树数据源
            addGroup / updateGroup / deleteGroup → 目录增删
            setSkinMount / setPlacement → 扩展绑定
  设计准则：面包屑、键盘导航+可见焦点、行内校验+错误就近+错误摘要、SVG 图标
-->
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--r-sm:5px;--r-md:7px;--r-lg:10px;--top-h:44px;--maxw:920px}
[data-theme="dark"]{--bg:#181818;--bg-panel:#1f1f1f;--bg-inset:#252526;--bg-hover:rgba(255,255,255,.055);--bg-active:rgba(255,255,255,.09);--text:#d4d4d4;--text-2:#9da0a6;--text-3:#6e7681;--line:rgba(255,255,255,.085);--line-strong:rgba(255,255,255,.18);--accent:#569cd6;--accent-text:#10151b;--accent-soft:rgba(86,156,214,.16);--red:#f14c4c;--danger-soft:rgba(241,76,76,.14);--amber:#e2b341;--green:#56d364;--toast-bg:#2d2d30;--toast-text:#d4d4d4;--shadow:rgba(0,0,0,.45);--scroll:rgba(140,140,140,.35)}
[data-theme="light"]{--bg:#e8e8e8;--bg-panel:#fff;--bg-inset:#f3f3f3;--bg-hover:rgba(0,0,0,.045);--bg-active:rgba(0,0,0,.08);--text:#1f1f1f;--text-2:#616161;--text-3:#9e9e9e;--line:rgba(0,0,0,.09);--line-strong:rgba(0,0,0,.17);--accent:#005fb8;--accent-text:#fff;--accent-soft:rgba(0,95,184,.12);--red:#cd3131;--danger-soft:rgba(205,49,49,.1);--amber:#bf8803;--green:#1a7f37;--toast-bg:#2d2d30;--toast-text:#fff;--shadow:rgba(0,0,0,.18);--scroll:rgba(0,0,0,.22)}
[data-theme="terminal"]{--bg:#0d0d0d;--bg-panel:#0d0d0d;--bg-inset:#12130f;--bg-hover:rgba(74,246,38,.07);--bg-active:rgba(74,246,38,.13);--text:#43d95e;--text-2:#2fa14b;--text-3:#1f7236;--line:rgba(74,246,38,.14);--line-strong:rgba(74,246,38,.3);--accent:#4af626;--accent-text:#051405;--accent-soft:rgba(74,246,38,.12);--red:#ff5f5f;--danger-soft:rgba(255,95,95,.12);--amber:#ffb64a;--green:#4af626;--toast-bg:#12130f;--toast-text:#43d95e;--shadow:rgba(0,0,0,.6);--scroll:rgba(74,246,38,.3)}
[data-theme="oled"]{--bg:#000;--bg-panel:#0a0a0a;--bg-inset:#121212;--bg-hover:rgba(255,255,255,.06);--bg-active:rgba(255,255,255,.1);--text:#e6e6e6;--text-2:#9c9c9c;--text-3:#666;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.2);--accent:#4ec9b0;--accent-text:#00110d;--accent-soft:rgba(78,201,176,.14);--red:#f14c4c;--danger-soft:rgba(241,76,76,.14);--amber:#e2b341;--green:#56d364;--toast-bg:#161616;--toast-text:#e6e6e6;--shadow:rgba(0,0,0,.7);--scroll:rgba(140,140,140,.35)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;caret-color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;font-size:13px;color:var(--text)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.icon{display:inline-flex;width:16px;height:16px;flex:none}.icon svg{width:100%;height:100%}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid transparent;background-clip:padding-box}

/* 顶栏 + 面包屑 */
.topbar{height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg-panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-weight:700;display:flex;align-items:center;gap:7px}.brand .icon{color:var(--accent)}
.crumb{display:flex;align-items:center;gap:3px;min-width:0;flex:1;font-size:12px;color:var(--text-2);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb button{padding:3px 7px;border-radius:var(--r-sm);color:var(--text-2);white-space:nowrap;flex:none}.crumb button:hover{background:var(--bg-hover);color:var(--text)}
.crumb .sep{color:var(--text-3);flex:none}.crumb .cur{color:var(--text);font-weight:600;padding:3px 7px;white-space:nowrap;flex:none}
.topbar .spacer{flex:1}

/* 页面 */
.stage{height:calc(100vh - var(--top-h));overflow:auto}
.page{max-width:var(--maxw);margin:0 auto;padding:22px 24px 40px}
.page-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;margin-top:3px;color:var(--text-2);border:1px solid var(--line);border-radius:var(--r-sm);white-space:nowrap;flex:none}
.back-btn:hover{background:var(--bg-hover);color:var(--text)}.back-btn .icon{width:14px;height:14px}
.skin-hero{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.skin-hero .bigicon{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-md)}
.skin-hero .bigicon .icon{width:20px;height:20px}
.skin-hero h1{font-size:17px;font-weight:600;line-height:1.3}
.skin-hero .sub{font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:2px}
.page-actions{display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;font-size:12.5px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--text);white-space:nowrap;flex:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--bg-hover)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.tiny{padding:3px 8px;font-size:11px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-sm);color:var(--text-2)}
.icon-btn:hover{background:var(--bg-active);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--text-2);background:var(--bg-inset);white-space:nowrap}
.pill.acc{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.pill.ok{color:var(--green)}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.6}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:9px 15px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* 面板 */
.panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:12.5px;font-weight:600}
.panel-head .count{margin-left:auto;font-size:11px;color:var(--text-3)}
.panel-body{padding:14px}

/* 介绍 */
.kv{display:grid;grid-template-columns:120px 1fr;gap:0}
.kv .k,.kv .v{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv .k{color:var(--text-3)}
.kv .v{color:var(--text);overflow-wrap:anywhere}
.kv .v.mono{font-size:11.5px}
.contract{margin-top:14px;background:var(--bg-inset);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:10.5px;color:var(--text-2);line-height:1.9}
.contract b{color:var(--accent);font-weight:500}
.contract span{display:block}

/* 预览 —— 经典分栏五区示意 */
.pv-classic{display:grid;grid-template-columns:1fr 2.2fr 1fr;grid-template-rows:34px 1fr 30px;gap:6px;height:300px;background:var(--bg);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:10px}
.pv-zone{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);color:var(--text-2);font-size:11.5px;background:var(--bg-panel)}
.pv-zone.can{border-style:solid;border-color:var(--accent-soft);background:var(--accent-soft);color:var(--accent)}
.pv-zone.top{grid-column:1/4}.pv-zone.bottom{grid-column:1/4}
.pv-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text-3);background:var(--bg-panel)}
.pv-center .icon{width:22px;height:22px;opacity:.6}
.pv-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--text-3)}
.pv-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pv-legend .a{background:var(--accent-soft);border:1px solid var(--accent)}
.pv-legend .b{background:var(--bg-panel);border:1px dashed var(--line-strong)}

/* 预览 —— 3D 工作室示意 */
.pv-room{position:relative;height:320px;background:var(--bg);border:1px dashed var(--line-strong);border-radius:var(--r-md);overflow:hidden}
.pv-room::after{content:"";position:absolute;left:8%;right:8%;bottom:14%;height:1px;background:var(--line-strong)}
.pv-obj{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px}
.pv-obj .box{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg-inset);border:1px solid var(--line-strong);border-bottom-width:3px;border-radius:6px;color:var(--accent)}
.pv-obj .box .icon{width:20px;height:20px}
.pv-obj .nm{font-size:11px;color:var(--text-2)}
.pv-obj .to{font-size:10px;font-family:var(--mono);color:var(--text-3);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 挂载点配置 —— 单一树 */
.tree-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tree-toolbar .hint{margin-left:auto}
.tree{padding:8px 0 14px}
.trow{display:flex;align-items:center;gap:7px;width:100%;min-height:30px;padding:3px 12px;text-align:left;font-size:12.5px;border-left:2px solid transparent}
.trow:hover{background:var(--bg-hover)}
.trow:focus-visible{outline:1px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.trow.root{font-weight:600}
.trow .chev{width:14px;height:14px;display:inline-flex;color:var(--text-3);transition:transform .12s;cursor:pointer}
.trow .chev.open{transform:rotate(90deg)}
.trow .chev.leaf{visibility:hidden}
.trow .icon{color:var(--text-2);width:15px;height:15px}
.trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sp{flex:1}
.trow .cnt{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.more{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-3);flex:none}
.more:hover{background:var(--bg-active);color:var(--text)}
.more .icon{width:14px;height:14px}
.tgroup{overflow:hidden}
.frow{display:flex;align-items:center;gap:8px;min-height:28px;font-size:12px;color:var(--text-2)}
.frow .icon{width:14px;height:14px;color:var(--text-3)}
.frow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sp{flex:1}
.frow:hover .btn{opacity:1}
.frow .btn{opacity:0;transition:opacity .12s}
.tree-empty{padding:26px;text-align:center;color:var(--text-3);font-size:12px}

/* 弹出菜单 */
.menu{position:fixed;z-index:60;min-width:150px;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:0 8px 24px var(--shadow);padding:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:4px;font-size:12px;text-align:left;color:var(--text-2)}
.menu button:hover{background:var(--bg-hover);color:var(--text)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:var(--danger-soft)}
.menu button .icon{width:14px;height:14px}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}

/* 弹窗 */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(430px,100%);max-height:90vh;overflow:auto;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 16px 40px var(--shadow);padding:18px}
.sheet h3{font-size:14px;margin-bottom:4px}
.sheet .sdesc{font-size:11.5px;color:var(--text-2);line-height:1.6;margin-bottom:14px}
.sheet .warn{background:var(--danger-soft);border:1px solid var(--red);border-radius:var(--r-sm);padding:9px 11px;color:var(--red);font-size:11.5px;margin-bottom:12px;line-height:1.6}
.sheet .vlist{background:var(--bg-inset);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;margin-bottom:12px;max-height:120px;overflow:auto}
.sheet .vlist div{font-size:11.5px;color:var(--text-2);padding:3px 0;display:flex;gap:7px;align-items:center}
.sheet .vlist .icon{width:13px;height:13px}
.err-summary{background:var(--danger-soft);border:1px solid var(--red);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:12px;color:var(--red);font-size:12px}
.err-summary[hidden]{display:none}
.err-summary ul{margin:5px 0 0 16px}
.err-summary a{color:var(--red);text-decoration:underline}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--text-2);margin-bottom:5px}
.input,.select{width:100%;height:30px;background:var(--bg-inset);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 9px;outline:none;transition:border-color .12s}
.input:focus,.select:focus{border-color:var(--accent)}
.input.bad,.select.bad{border-color:var(--red)}
.field .err{display:block;font-size:11px;color:var(--red);margin-top:4px}
.field .err:empty{display:none}
.charcount{float:right;font-family:var(--mono);font-size:10px;color:var(--text-3)}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:90;background:var(--toast-bg);color:var(--toast-text);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 15px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 8px 24px var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){
  .page{padding:16px 14px 32px}
  .page-header{flex-wrap:wrap}
  .page-actions{width:100%}
  .kv{grid-template-columns:92px 1fr}
  .trow .cnt{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="dark">
<header class="topbar">
  <div class="brand"><span class="icon" id="brandIcon"></span><span>WorkHub</span></div>
  <nav class="crumb" id="crumb" aria-label="面包屑导航"></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题"></button>
</header>
<div class="stage" id="stage"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= 图标（Lucide 线性） ================= */
const P=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
  puzzle:P('<path d="M9.5 4.5a2 2 0 0 1 4 0v1h2.5A1.5 1.5 0 0 1 17.5 7v2.5h1a2 2 0 0 1 0 4h-1V16a1.5 1.5 0 0 1-1.5 1.5h-2.5v1a2 2 0 0 1-4 0v-1H7A1.5 1.5 0 0 1 5.5 16v-2.5h-1a2 2 0 0 1 0-4h1V7A1.5 1.5 0 0 1 7 5.5h2.5z"/>'),
  back:P('<path d="m14.5 6-6 6 6 6"/>'),
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  chev:P('<path d="m9 6 6 6-6 6"/>'),
  folder:P('<path d="M3.5 8a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
  file:P('<path d="M7 3.5h7l4 4.5V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5z"/><path d="M14 3.5V8h4.5"/>'),
  disk:P('<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M7 9h.01"/>'),
  plus:P('<path d="M12 5v14M5 12h14"/>'),
  trash:P('<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1.5 1.5 0 0 0 1.5 1.4h7A1.5 1.5 0 0 0 17 20l1-13"/>'),
  edit:P('<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/>'),
  eye:P('<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/>'),
  tree:P('<path d="M5 4v7a3 3 0 0 0 3 3h11"/><path d="M5 18h6"/><rect x="15" y="12" width="5" height="5" rx="1"/><rect x="2" y="2" width="5" height="4" rx="1"/><rect x="2" y="16" width="5" height="4" rx="1"/>'),
  info:P('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11.5 12H12v4h.5"/>'),
  settings:P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>'),
  note:P('<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>'),
  check:P('<path d="m5 12.5 4.5 4.5L19 7"/>'),
  x:P('<path d="M6 6l12 12M18 6 6 18"/>'),
};
const ic=(k,c='')=>`<span class="icon ${c}">${I[k]||I.file}</span>`;
document.getElementById('brandIcon').innerHTML=I.puzzle;
document.getElementById('btnTheme').innerHTML=I.info;

/* ================= 数据 ================= */
const EXTS={
  todo:{name:'TODO',type:'已安装'},

/* ================= 渲染入口 ================= */
function render(){
  $('#crumb').innerHTML='';
  const mk=(label,fn,cur)=>{
    if($('#crumb').children.length) $('#crumb').append(Object.assign(document.createElement('span'),{className:'sep',textContent:'/'}));
    if(cur){const b=document.createElement('span');b.className='cur';b.textContent=label;$('#crumb').append(b);}
    else{const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('#crumb').append(b);}
  };
  mk('设置',()=>{S.view='settings';render()});
  mk('界面样式',()=>{S.view='settings';render()});
  if(S.view==='detail') mk(skin().name,null,true);
  const crumbEl=$('#crumb');crumbEl.scrollLeft=crumbEl.scrollWidth;
  $('#stage').innerHTML='';
  (S.view==='settings'?renderSettings:renderDetail)();
  closeMenu();
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}

/* ---------- 挂载点配置（单一树） ---------- */
function renderMounts(){
  $('#tabPanel').innerHTML='';
  const sk=skin(),panel=document.createElement('section');panel.className='panel';
  panel.innerHTML=`<div class="panel-head"><h3>挂载点配置</h3><span class="count">${countPoints(sk)} 个挂载点</span></div>
    <div class="tree-toolbar"><button class="btn primary" id="btnAdd">${I.plus} 新增挂载点</button><span class="hint">删除已挂载扩展的节点时会先弹窗确认并转移绑定</span></div>
    <div class="tree" id="tree" role="tree" aria-label="挂载点树"></div>`;
  panel.querySelector('#btnAdd').onclick=()=>openAdd();
  const tree=panel.querySelector('#tree');
  sk.points.forEach(p=>tree.append(nodeRow(p,0)));
  $('#tabPanel').append(panel);
}
function nodeRow(node,depth){
  const sk=skin(),key=sk.id+':'+node.id,hasKids=!!node.children?.length,open=S.expanded.has(key);
  const row=document.createElement('div');row.className='trow'+(depth===0?' root':'');row.setAttribute('role','treeitem');row.tabIndex=0;
  row.style.paddingLeft=(12+depth*20)+'px';
  row.setAttribute('aria-expanded',hasKids?String(open):'false');
  const chev=`<span class="chev ${hasKids?(open?'open':''):'leaf'}">${I.chev}</span>`;
  const ico=ic(node.kind==='object'?'disk':'folder');
  const bindCount=(node.mounts?.length||0);
  row.innerHTML=chev+ico+'<span class="tn"></span><span class="sp"></span>'+(bindCount?`<span class="cnt">${bindCount} 绑定</span>`:'')+'<span class="more" role="button" tabindex="0" aria-label="更多操作">'+I.more+'</span>';
  row.querySelector('.tn').textContent=node.name;
  row.querySelector('.chev').onclick=e=>{e.stopPropagation();if(hasKids){open?S.expanded.delete(key):S.expanded.add(key);renderMounts()}};
  row.onclick=()=>{if(hasKids){open?S.expanded.delete(key):S.expanded.add(key);renderMounts()}};
  row.onkeydown=e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click()}
    if(e.key==='ArrowRight'&&hasKids&&!open){e.preventDefault();S.expanded.add(key);renderMounts()}
    if(e.key==='ArrowLeft'&&hasKids&&open){e.preventDefault();S.expanded.delete(key);renderMounts()}
  };
  const more=row.querySelector('.more');
  more.onclick=e=>{e.stopPropagation();openMenu(e.currentTarget,menuItems(node))};
  more.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();openMenu(e.currentTarget,menuItems(node))}};
  const frag=document.createDocumentFragment();frag.append(row);
  if(open&&hasKids){
    const g=document.createElement('div');g.className='tgroup';g.setAttribute('role','group');
    node.children.forEach(c=>g.append(nodeRow(c,depth+1)));frag.append(g);
  }
  // 展开时列出本节点的扩展绑定
  if(open&&bindCount){
    const g=document.createElement('div');g.className='tgroup';g.style.paddingLeft=(32+depth*20)+'px';
    node.mounts.forEach(id=>{
      const f=document.createElement('div');f.className='frow';
      f.innerHTML=ic('file')+'<span class="fn"></span><span class="pill">'+EXTS[id].type+'</span><span class="sp"></span><button class="btn tiny">改绑</button>';
      f.querySelector('.fn').textContent=EXTS[id].name;
      f.querySelector('button').onclick=()=>openRebind(node,id);
      g.append(f);
    });frag.append(g);
  }
  return frag;
}
function menuItems(node){
  const items=[];
  if(node.children||skin().layout==='panels') items.push({label:'新增子挂载点',icon:'plus',fn:()=>openAdd(node)});
  items.push({label:'重命名',icon:'edit',fn:()=>openRename(node)});
  items.push({sep:true});
  items.push({label:'删除挂载点',icon:'trash',danger:true,fn:()=>openDelete(node)});
  return items;
}
function allNodes(){
  const out=[];const w=(a,parent)=>a.forEach(p=>{out.push({node:p,parent});if(p.children)w(p.children,p)});
  w(skin().points,null);return out;
}
const nodeLabel=n=>n.name;

/* ---------- 弹出菜单 ---------- */
let curMenu=null;
function closeMenu(){curMenu?.remove();curMenu=null}
function openMenu(anchor,items){
  closeMenu();const m=document.createElement('div');m.className='menu';
  items.forEach(it=>{
    if(it.sep){m.append(Object.assign(document.createElement('div'),{className:'sep'}));return}
    const b=document.createElement('button');b.className=it.danger?'danger':'';b.innerHTML=ic(it.icon)+'<span></span>';
    b.querySelector('span').textContent=it.label;b.onclick=()=>{closeMenu();it.fn()};m.append(b);
  });
  document.body.append(m);curMenu=m;
  const r=anchor.getBoundingClientRect();
  let left=r.right-m.offsetWidth,top=r.bottom+4;
  if(top+m.offsetHeight>innerHeight-8) top=Math.max(8,r.top-m.offsetHeight-4);
  m.style.left=Math.max(8,left)+'px';m.style.top=top+'px';
  setTimeout(()=>document.addEventListener('mousedown',outside),0);
  function outside(e){if(!m.contains(e.target)&&!anchor.contains(e.target)){closeMenu();document.removeEventListener('mousedown',outside)}}
}

/* ---------- 通用表单弹窗（行内校验 + 错误摘要） ---------- */
function formSheet({title,desc,warnHTML='',extraHTML='',fields,submit='保存',danger=false,validate,onSave}){
  const ov=document.createElement('div');ov.className='overlay';
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  sh.innerHTML=`<h3 id="ft"></h3><p class="sdesc" id="fd"></p>${warnHTML}${extraHTML}
    <div class="err-summary" role="alert" tabindex="-1" hidden><b>存在需要修正的问题</b><ul></ul></div>
    <div class="ff"></div><div class="sheet-actions"></div>`;
  sh.querySelector('#ft').textContent=title;sh.querySelector('#fd').textContent=desc;
  const ff=sh.querySelector('.ff');
  fields.forEach(f=>{
    const w=document.createElement('div');w.className='field';
    w.innerHTML=`<label for="f_${f.id}">${f.label}${f.required?' *':''}</label>
      ${f.type==='select'?`<select class="select" id="f_${f.id}"></select>`:`<input class="input" id="f_${f.id}" maxlength="${f.max||40}" autocomplete="off">`}
      ${f.hint?`<span class="charcount">${f.hint}</span>`:''}<span class="err" id="e_${f.id}"></span>`;
    const c=w.querySelector('.input,.select');
    if(f.type==='select')c.innerHTML=f.options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('');
    else c.value=f.value||'';
    ff.append(w);
  });
  const acts=sh.querySelector('.sheet-actions');
  const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='取消';cancel.onclick=()=>ov.remove();acts.append(cancel);
  const ok=document.createElement('button');ok.className='btn '+(danger?'danger':'primary');ok.textContent=submit;
  const collect=()=>Object.fromEntries(fields.map(f=>[f.id,sh.querySelector('#f_'+f.id).value.trim()]));
  const showErr=errs=>{
    fields.forEach(f=>{const c=sh.querySelector('#f_'+f.id),e=sh.querySelector('#e_'+f.id);e.textContent=errs[f.id]||'';c.classList.toggle('bad',!!errs[f.id]);if(errs[f.id])c.setAttribute('aria-describedby','e_'+f.id);else c.removeAttribute('aria-describedby')});
    const keys=Object.keys(errs),s=sh.querySelector('.err-summary');
    if(keys.length){const ul=s.querySelector('ul');ul.innerHTML='';keys.forEach(k=>{const li=document.createElement('li'),a=document.createElement('a');a.href='#f_'+k;a.textContent=errs[k];a.onclick=e=>{e.preventDefault();sh.querySelector('#f_'+k).focus()};li.append(a);ul.append(li)});s.hidden=false;s.focus()}
    else s.hidden=true;
    return !keys.length;
  };
  ok.onclick=()=>{const v=collect(),errs=validate?validate(v):{};if(!showErr(errs))return;onSave(v);ov.remove()};acts.append(ok);
  fields.forEach(f=>{const c=sh.querySelector('#f_'+f.id);c.addEventListener('blur',()=>{const errs=validate?validate(collect()):{};const e=sh.querySelector('#e_'+f.id);e.textContent=errs[f.id]||'';c.classList.toggle('bad',!!errs[f.id])})});
  ov.append(sh);document.body.append(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  setTimeout(()=>sh.querySelector('.input,.select')?.focus(),40);
  return sh;
}
function openAdd(parent){
  const sk=skin(),zoneOpts=(sk.points.filter(p=>p.kind==='zone').map(p=>({value:p.id,label:p.name})));
  formSheet({
    title:'新增挂载点',desc:`样式「${sk.name}」· 对应 addGroup() / mountPoints 声明`,
    fields:[
      {id:'name',label:'名称',required:true,max:24,hint:'0 / 24',value:''},
      ...(parent||sk.layout==='stage'?[]:[{id:'parent',label:'所属分区',type:'select',options:zoneOpts}]),
      ...(sk.layout==='panels'&&!parent?[{id:'kind',label:'类型',type:'select',options:[{value:'folder',label:'目录分组'},{value:'zone',label:'分区（五区之一）'}]}]:[]),
    ],
    validate:v=>{
      const e={};if(!v.name)e.name='请输入挂载点名称';else if(v.name.length>24)e.name='名称不超过 24 个字符';
      const pool=parent?(parent.children||[]):(v.parent?sk.points.find(p=>p.id===v.parent)?.children||[]:sk.points);
      if(v.name&&pool.some(n=>n.name===v.name))e.name='同级下已存在同名挂载点';return e;
    },
    onSave:v=>{
      const node={id:'g'+Date.now().toString(36),name:v.name,kind:v.kind||(sk.layout==='stage'?'object':'folder'),mounts:[]};
      if(parent){parent.children=parent.children||[];parent.children.push(node)}
      else if(v.parent){const z=sk.points.find(p=>p.id===v.parent);z.children=z.children||[];z.children.push(node)}
      else sk.points.push(node);
      S.expanded.add(sk.id+':'+(parent?.id||v.parent||'root'));render();toast('已新增挂载点：'+v.name);
    },submit:'创建',
  });
}
function openRename(node){
  const sk=skin(),siblings=(sk.points.includes(node)?sk.points:(allNodes().find(x=>x.node===node)?.parent?.children||[]));
  formSheet({title:'重命名挂载点',desc:'对应 updateGroup(id, { name })',
    fields:[{id:'name',label:'名称',required:true,max:24,hint:'0 / 24',value:node.name}],
    validate:v=>{const e={};if(!v.name)e.name='请输入名称';else if(siblings.some(n=>n!==node&&n.name===v.name))e.name='同级下已存在同名挂载点';return e},
    onSave:v=>{node.name=v.name;render();toast('已重命名')}});
}
function openDelete(node){
  const binds=node.mounts||[],children=node.children||[],childBinds=children.flatMap(c=>c.mounts||[]);
  const affected=[...binds,...childBinds];
  const targets=allNodes().filter(x=>x.node!==node&&!descendant(node,x.node)&&x.node.kind!=='zone').map(x=>({value:x.node.id,label:nodePath(x.node)}));
  if(!affected.length){
    formSheet({title:'删除挂载点',desc:`确定删除「${node.name}」？该挂载点没有扩展绑定。`,fields:[],submit:'删除',danger:true,
      onSave:()=>{removeNode(node);toast('已删除挂载点：'+node.name)}});
    return;
  }
  formSheet({
    title:'删除挂载点 · 需确认',desc:`「${node.name}」已挂载 ${affected.length} 个扩展，删除前需要指定它们的去向。`,
    warnHTML:`<div class="warn">该挂载点已有扩展绑定，直接删除会使这些扩展失去挂载位置。</div>`,
    extraHTML:`<div class="vlist">${affected.map(id=>'<div>'+ic('file')+'<span></span></div>').join('')}</div>`,
    fields:[{id:'target',label:'将绑定转移到',type:'select',options:targets.length?targets:[{value:'',label:'无可用目标（将解除挂载）'}]}],
    validate:v=>targets.length&&!v.target?{target:'请选择转移目标'}:{},
    submit:'确认删除',danger:true,
    onSave:v=>{
      const all=allNodes().map(x=>x.node);
      const tgt=all.find(n=>n.id===v.target);
      affected.forEach(id=>{if(tgt){tgt.mounts=tgt.mounts||[];if(!tgt.mounts.includes(id))tgt.mounts.push(id)}});
      removeNode(node);render();toast(tgt?`已删除，${affected.length} 个绑定转移至「${tgt.name}」`:'已删除并解除绑定');
    },
  });
  const list=document.querySelector('.overlay .vlist');
  if(list) affected.forEach((id,i)=>{const s=list.children[i]?.querySelector('span');if(s)s.textContent=EXTS[id].name+'（'+EXTS[id].type+'）'});
}
function descendant(root,n){let cur=n;while(cur){if(cur===root)return true;cur=allNodes().find(x=>x.node===cur)?.parent}return false}
function nodePath(n){const chain=[];let cur=n;while(cur){chain.unshift(cur.name);cur=allNodes().find(x=>x.node===cur)?.parent}return chain.join(' / ')}
function removeNode(node){
  const sk=skin(),entry=allNodes().find(x=>x.node===node);
  if(entry?.parent)entry.parent.children=entry.parent.children.filter(n=>n!==node);
  else sk.points=sk.points.filter(n=>n!==node);
  S.expanded.delete(sk.id+':'+node.id);render();
}
function openRebind(node,oldId){
  formSheet({title:'修改绑定扩展',desc:`挂载点「${node.name}」· 对应 setSkinMount() / setPlacement()`,
    fields:[{id:'ext',label:'扩展',type:'select',options:Object.entries(EXTS).map(([id,e])=>({value:id,label:e.name+'（'+e.type+'）'}))}],
    onSave:v=>{node.mounts=node.mounts.map(m=>m===oldId?v.ext:m);render();toast('已更新绑定：'+EXTS[v.ext].name)}});
}

/* 主题 */
$('#btnTheme').onclick=()=>{S.theme=(S.theme+1)%THEMES.length;document.body.dataset.theme=THEMES[S.theme];$('#btnTheme').title='主题：'+TL[THEMES[S.theme]]+'（点击切换）';toast('主题：'+TL[THEMES[S.theme]])};
$('#btnTheme').title='主题：深色（点击切换）';
render();
</script>
